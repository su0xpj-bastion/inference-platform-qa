name: ci
on:
  pull_request:
  push: {branches: [main]}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testbed:
    name: unit + integration (local testbed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - uses: actions/setup-go@v7
        with: {go-version: "1.22", cache-dependency-path: tools/lbprobe/go.mod}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest --junitxml=reports/junit.xml
      - run: cd tools/lbprobe && go vet ./... && go test ./...
      - run: scripts/smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: testbed-reports, path: reports/}

  kind:
    name: cluster (kind + ingress-nginx)
    needs: testbed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/setup-go@v7
        with: {go-version: "1.22"}
      - uses: helm/kind-action@v1.15.2
        with: {cluster_name: inference, config: deploy/kind/kind-config.yaml}
      - name: deploy (ingress-nginx + image + overlay)
        run: scripts/kind_deploy.sh inference
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: cluster tests
        env: {INGRESS_URL: "http://localhost:8080"}
        run: .venv/bin/python -m pytest -m cluster tests/cluster --junitxml=reports/junit-cluster.xml -p no:cacheprovider -o addopts=""
      - name: spread gate through real ingress
        run: cd tools/lbprobe && go run . -url http://localhost:8080/v1/chat/completions -host inference.local -n 300 -c 20
      - name: diagnostics (always, so passing runs keep the drain timeline too)
        if: always()
        run: scripts/collect_diagnostics.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: cluster-reports, path: reports/}
